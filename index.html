<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CaliXAi-form check</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
      crossorigin="anonymous"
    ></script>
    <!-- ✅ Match the version explicitly here as well -->
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"
      crossorigin="anonymous"
    ></script>
       <script src="skills/pose-utils.js" defer></script>
    <script src="skills/handstand.js" defer></script>
    <script src="skills/pushup.js" defer></script>
    <script src="skills/lsit.js" defer></script>
    <script src="skills/handstandpushup.js" defer></script>
    <script src="skills/elbowlever.js" defer></script>
    <script src="skills/planche.js" defer></script>
    <script src="skills/frontlever.js" defer></script>
    <script src="skills/pullup.js" defer></script>
    <script src="skills/muscleup.js" defer></script>
    <script src="skills/backlever.js" defer></script>
    <script src="skills/vsit.js" defer></script>
    <script src="skills/pikepushup.js" defer></script>
    <script src="skills/90degreehold.js" defer></script>
    <script src="skills/crowpose.js" defer></script>
    <script src="skills/frogstand.js" defer></script>
    <script src="skills/straddleplanche.js" defer></script>
    <script src="skills/planchelean.js" defer></script>
    <script src="skills/ninetydegreehspu.js" defer></script>
    <script src="skills/pseudoplanchepushup.js" defer></script>
    <script src="skills/planchepushup.js" defer></script>
    <script src="skills/squat.js" defer></script>
    <script type="module" src="app.js" defer></script>
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
<!-- Replace the static script tag with this inline check -->
<script>
  if (window.location.hostname !== '127.0.0.1' && window.location.hostname !== 'localhost') {
    const s = document.createElement('script');
    s.defer = true;
    s.src = '/_vercel/insights/script.js';
    document.head.appendChild(s);
  }
</script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- 🍿 Cinematic Background Video Layer -->
    <video id="bg-video" autoplay loop muted playsinline>
      <!-- High-quality free calisthenics/workout video placeholder -->
      <source
        src="video.mp4"
        type="video/mp4"
      />
      Your browser does not support the video tag.
    </video>
    <div class="container">
      <div class="text">
        <span>Check your form</span>
      </div>
      <div class="upload-bar">
        <div class="box" id="main-box">
          <!-- 🎞️ THE VIDEO THUMBNAIL CAPSULE (Hidden by default) -->
          <div
            class="preview-container"
            id="preview-container"
            style="display: none"
          >
            <div class="thumbnail-wrapper">
              <video id="preview-video" muted></video>
              <button type="button" class="remove-btn" id="remove-btn">
                &times;
              </button>
            </div>
          </div>

          <!-- 🛠️ THE BOTTOM INTERACTION ROW -->
          <div class="input-row">
            <button
              type="button"
              class="icon-btn"
              id="plus"
              aria-label="Add video"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>
            <input
              type="text"
              id="skill-input"
              class="text2"
              placeholder="Name of your skill eg. handstand,lsit,etc."
              autocomplete="off"
            />
            <input
              type="file"
              id="hidden-video-input"
              accept="video/*"
              style="display: none"
            />
            <!-- 🆕 LIVE CAMERA MODE TRIGGER -->
            <button
              type="button"
              class="icon-btn"
              id="go-live"
              aria-label="Start live coaching"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="3" />
                <path d="M12 5V3M12 21v-2M5 12H3M21 12h-2" />
              </svg>
            </button>
            <button
              type="button"
              class="icon-btn"
              id="upload"
              aria-label="Upload and scan"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="19" x2="12" y2="5" />
                <polyline points="5 12 12 5 19 12" />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div
        class="analysis-workspace"
        id="analysis-workspace"
        style="display: none"
      >
        <div class="canvas-wrapper">
          <div class="live-toolbar" id="live-toolbar" hidden>
            <div class="live-toolbar-left">
              <span id="session-timer" class="session-timer-badge">00:00</span>
              <span id="current-skill-badge" class="live-skill-badge">Push-up</span>
              <span id="rep-count" class="live-counter-badge">0</span>
            </div>
            <div class="live-toolbar-right">
              <button
                type="button"
                class="live-tool-btn"
                id="change-skill-btn"
                aria-label="Change skill"
              >
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 7h11" />
                  <path d="M4 17h11" />
                  <path d="M15 7l3-3 3 3" />
                  <path d="M15 17l3 3 3-3" />
                </svg>
                <span>Change Skill</span>
              </button>
              <button
                type="button"
                class="icon-btn live-icon-btn"
                id="pause-live-btn"
                aria-label="Pause live session"
              >
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                  <rect x="6" y="5" width="4" height="14" rx="1" />
                  <rect x="14" y="5" width="4" height="14" rx="1" />
                </svg>
              </button>
              <button
                type="button"
                class="icon-btn live-icon-btn"
                id="mute-live-btn"
                aria-label="Mute audio cues"
              >
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                  <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                  <path d="M19 6a9 9 0 0 1 0 12" />
                </svg>
              </button>
              <button
                type="button"
                class="icon-btn"
                id="stop-live"
                aria-label="End live session"
              >
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <rect x="6" y="6" width="12" height="12" rx="2" />
                </svg>
              </button>
            </div>
          </div>
          <div class="pause-overlay" id="pause-overlay" hidden>
            <span>Paused</span>
          </div>
          <canvas id="analysis-canvas"></canvas>
        </div>
        <div class="dashboard-row">
          <!-- Form Rating Panel -->
          <div class="data-card score-card">
            <span class="card-label">FORM SCORE</span>
            <div class="score-display">
              <span id="form-score-value">--</span
              ><span class="score-total">/100</span>
            </div>
          </div>

          <!-- AI Coaching Advice Box -->
          <div class="data-card advice-card">
            <span class="card-label">AI COACHING INSIGHTS</span>
            <p id="coaching-advice">
              Awaiting video upload to run biomechanical analysis...
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="skill-switcher-modal" hidden>
      <div class="modal-card" role="dialog" aria-labelledby="skill-switcher-title" aria-modal="true">
        <h2 id="skill-switcher-title">Change skill</h2>
        <p class="modal-copy">Pick the next live skill. Your camera, session timer, and previous segments stay running.</p>
        <div class="skill-card-list" id="skill-switcher-list"></div>
        <div class="modal-actions">
          <button type="button" class="modal-btn secondary" id="cancel-skill-switch">Cancel</button>
          <button type="button" class="modal-btn primary" id="confirm-skill-switch">Switch Skill</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="session-report-modal" hidden>
      <div class="modal-card report-card" role="dialog" aria-labelledby="session-report-title" aria-modal="true">
        <h2 id="session-report-title">Session report</h2>
        <div id="session-report-body"></div>
        <div class="modal-actions">
          <button type="button" class="modal-btn primary" id="close-session-report">Close &amp; New Workout</button>
        </div>
      </div>
    </div>
  </body>
</html>
